version: '3'
services:
  opensearch-node1:
    image: opensearchstaging/opensearch:3.4.0
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster # Sets the name of the OpenSearch cluster
      - node.name=opensearch-node1 # Sets the name of the node in the cluster
      - discovery.seed_hosts=opensearch-node1,opensearch-node2 # Defines initial nodes for cluster discovery
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2 # Defines initial cluster manager nodes
      - bootstrap.memory_lock=true # along with the memlock settings below, disables swapping
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyPassword123! # Sets the initial admin password
      - http.type=reactor-netty4
      - opensearch.experimental.feature.transport.stream.enabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m -Dio.netty.allocator.numDirectArenas=1 -Dio.netty.noUnsafe=false -Dio.netty.tryUnsafe=true -Dio.netty.tryReflectionSetAccessible=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
#      - "DISABLE_SECURITY_PLUGIN=true"
      - arrow.flight.publish_host=opensearch-node1
      - arrow.flight.bind_host=opensearch-node1

    ulimits:
      memlock:
        soft: -1 # Ensures unlimited memory locking
        hard: -1
      nofile:
        soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    volumes:
      # Persist data for the first OpenSearch node to ensure cluster state, indexes, and metadata are retained
      - opensearch-data1:/usr/share/opensearch/data

      # Mount the local plugin build directory into the container to make custom plugins available for installation
      - /Volumes/workplace/ml-commons/plugin/build/distributions/:/usr/share/opensearch/ml-plugin
      - /Volumes/workplace/OpenSearch/plugins/transport-reactor-netty4/build/distributions/:/usr/share/opensearch/transport-plugin
      - /Volumes/workplace/OpenSearch/plugins/arrow-flight-rpc/build/distributions/:/usr/share/opensearch/arrow-plugin

    command: >
      bash -c "
      echo 'Listing ML plugin directory:';
      ls -la /usr/share/opensearch/ml-plugin/;
      
      echo 'Removing old plugins...';
      bin/opensearch-plugin remove opensearch-skills || true;
      bin/opensearch-plugin remove opensearch-ml || true;
      bin/opensearch-plugin remove arrow-flight-rpc || true;
      bin/opensearch-plugin remove transport-reactor-netty4 || true;
      
      echo 'Installing ML plugin...';
      bin/opensearch-plugin install --batch --verbose file:///usr/share/opensearch/ml-plugin/opensearch-ml-3.4.0.0-SNAPSHOT.zip;
      
      echo 'Installing transport plugin...';
      bin/opensearch-plugin install --batch --verbose file:///usr/share/opensearch/transport-plugin/transport-reactor-netty4-3.4.0-SNAPSHOT.zip;
      
      echo 'Installing arrow plugin...';
      bin/opensearch-plugin install --batch --verbose file:///usr/share/opensearch/arrow-plugin/arrow-flight-rpc-3.4.0-SNAPSHOT.zip;
      
      echo 'Listing installed plugins:';
      ls -la /usr/share/opensearch/plugins/;
      
      ./opensearch-docker-entrypoint.sh opensearch
      "
    ports:
      - 9200:9200 # Main OpenSearch API port
      - 9600:9600 # required for Performance Analyzer
      - 5005:5005 # Debugging port

    networks:
      - opensearch-net # Connects to OpenSearch network

  opensearch-node2:
    image: opensearchstaging/opensearch:3.4.0
    container_name: opensearch-node2
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=MyPassword123!
      - http.type=reactor-netty4
      - opensearch.experimental.feature.transport.stream.enabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m -Dio.netty.allocator.numDirectArenas=1 -Dio.netty.noUnsafe=false -Dio.netty.tryUnsafe=true -Dio.netty.tryReflectionSetAccessible=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
#      - "DISABLE_SECURITY_PLUGIN=true"
      - arrow.flight.publish_host=opensearch-node2
      - arrow.flight.bind_host=opensearch-node2

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      # Persist data for the second OpenSearch node to maintain high availability and redundancy
      - opensearch-data2:/usr/share/opensearch/data

      # Mount the local plugin build directory into the container to make custom plugins available for installation
      - /Volumes/workplace/ml-commons/plugin/build/distributions/:/usr/share/opensearch/ml-plugin
      - /Volumes/workplace/OpenSearch/plugins/transport-reactor-netty4/build/distributions/:/usr/share/opensearch/transport-plugin
      - /Volumes/workplace/OpenSearch/plugins/arrow-flight-rpc/build/distributions/:/usr/share/opensearch/arrow-plugin

    command: >
      bash -c "
      echo 'Listing ML plugin directory:';
      ls -la /usr/share/opensearch/ml-plugin/;
      
      echo 'Removing old plugins...';
      bin/opensearch-plugin remove opensearch-skills || true;
      bin/opensearch-plugin remove opensearch-ml || true;
      bin/opensearch-plugin remove arrow-flight-rpc || true;
      bin/opensearch-plugin remove transport-reactor-netty4 || true;
      
      echo 'Installing ML plugin...';
      bin/opensearch-plugin install --batch --verbose file:///usr/share/opensearch/ml-plugin/opensearch-ml-3.4.0.0-SNAPSHOT.zip;
      
      echo 'Installing transport plugin...';
      bin/opensearch-plugin install --batch --verbose file:///usr/share/opensearch/transport-plugin/transport-reactor-netty4-3.4.0-SNAPSHOT.zip;
      
      echo 'Installing arrow plugin...';
      bin/opensearch-plugin install --batch --verbose file:///usr/share/opensearch/arrow-plugin/arrow-flight-rpc-3.4.0-SNAPSHOT.zip;
      
      echo 'Listing installed plugins:';
      ls -la /usr/share/opensearch/plugins/;
      
      ./opensearch-docker-entrypoint.sh opensearch
      "
    networks:
      - opensearch-net

    ports:
      - 5007:5007


volumes:
  opensearch-data1:
  opensearch-data2:


networks:
  opensearch-net: